<div class="workspace" [class.has-detail]="detailOpen()">
  <div class="workspace-list">
    <ng-content select="[workspace-list]" />
  </div>

  @if (detailOpen()) {
    <div class="workspace-backdrop" (click)="close()" aria-hidden="true"></div>
  }

  <section
    #panel
    class="workspace-detail"
    [class.is-open]="detailOpen()"
    [attr.aria-label]="detailLabel()"
    tabindex="-1"
  >
    @if (detailOpen() || alwaysShowDetail()) {
      <div class="workspace-detail-bar">
        <span class="workspace-detail-label">{{ detailLabel() }}</span>
        @if (detailOpen()) {
          <app-button
            variant="ghost"
            size="sm"
            [isIconOnly]="true"
            [ariaLabel]="'Close ' + detailLabel().toLowerCase()"
            (clicked)="close()"
          >
            <svg class="close-icon" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
              <path
                fill-rule="evenodd"
                d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z"
                clip-rule="evenodd"
              />
            </svg>
          </app-button>
        }
      </div>
      <ng-content select="[workspace-detail]" />
    } @else {
      <div class="workspace-placeholder" aria-hidden="true">
        <svg viewBox="0 0 80 80" fill="none" class="placeholder-art">
          <circle cx="40" cy="40" r="36" fill="#eef4f8" />
          <rect x="24" y="26" width="32" height="28" rx="4" fill="#123B5D" opacity="0.18" />
          <rect x="29" y="32" width="22" height="3" rx="1.5" fill="#123B5D" />
          <rect x="29" y="39" width="16" height="3" rx="1.5" fill="#123B5D" opacity="0.6" />
          <rect x="29" y="46" width="10" height="3" rx="1.5" fill="#16A36A" />
        </svg>
        <p>{{ placeholder() }}</p>
      </div>
    }
  </section>
</div>

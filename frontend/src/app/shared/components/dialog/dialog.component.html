@if (isOpen) {
  <div
    class="dialog-backdrop"
    (click)="onBackdropClick($event)"
    role="presentation"
  >
    <div
      #dialogPanel
      class="dialog-panel"
      [attr.role]="role"
      aria-modal="true"
      [attr.aria-labelledby]="title ? titleId : null"
      [attr.aria-describedby]="description ? descriptionId : null"
      [attr.aria-busy]="loading"
      [style.max-width]="maxWidth"
      tabindex="-1"
    >
      @if (loading) {
        <div class="dialog-loading-overlay" aria-hidden="true">
          <app-spinner size="lg" color="navy" label="Processing request"></app-spinner>
        </div>
      }

      <div class="dialog-header">
        <div class="dialog-title-group">
          @if (title) {
            <h2 [id]="titleId" class="dialog-title">{{ title }}</h2>
          }
          @if (description) {
            <p [id]="descriptionId" class="dialog-description">{{ description }}</p>
          }
        </div>

        @if (!disableClose) {
          <app-button
            variant="ghost"
            size="sm"
            [isIconOnly]="true"
            ariaLabel="Close dialog"
            (clicked)="close()"
          >
            <svg class="close-icon" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
              <path
                fill-rule="evenodd"
                d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z"
                clip-rule="evenodd"
              />
            </svg>
          </app-button>
        }
      </div>

      <div class="dialog-body">
        <ng-content></ng-content>
      </div>

      <div class="dialog-footer">
        <ng-content select="[dialog-actions]"></ng-content>
      </div>
    </div>
  </div>
}

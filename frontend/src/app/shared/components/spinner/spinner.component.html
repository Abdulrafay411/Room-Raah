<span
  class="spinner-wrapper"
  [class.spinner-sm]="size === 'sm'"
  [class.spinner-md]="size === 'md'"
  [class.spinner-lg]="size === 'lg'"
  [class.spinner-navy]="color === 'navy'"
  [class.spinner-green]="color === 'green'"
  [class.spinner-white]="color === 'white'"
  [class.spinner-current]="color === 'current'"
  role="status"
  aria-live="polite"
>
  <svg
    class="spinner-svg"
    viewBox="0 0 24 24"
    fill="none"
    xmlns="http://www.w3.org/2000/svg"
    aria-hidden="true"
    focusable="false"
  >
    <circle
      class="spinner-track"
      cx="12"
      cy="12"
      r="10"
      stroke="currentColor"
      stroke-width="3"
    ></circle>
    <path
      class="spinner-arc"
      fill="currentColor"
      d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"
    ></path>
  </svg>
  <span class="sr-only">{{ label }}</span>
</span>

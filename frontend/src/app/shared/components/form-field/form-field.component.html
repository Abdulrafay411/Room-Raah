<div
  class="field-container"
  [class.has-error]="!!error"
  [class.is-disabled]="disabled"
  [class.is-loading]="loading"
>
  @if (label) {
    <div class="field-label-row">
      <label [attr.for]="resolvedId" class="field-label">
        {{ label }}
        @if (required) {
          <span class="required-indicator" aria-hidden="true">*</span>
          <span class="sr-only">(required)</span>
        }
      </label>

      @if (loading) {
        <span class="field-loading-indicator" aria-hidden="true">
          <app-spinner size="sm" color="navy" label="Validating"></app-spinner>
        </span>
      }
    </div>
  }

  <div class="field-control-wrapper">
    <ng-content></ng-content>
  </div>

  @if (error) {
    <div [id]="errorId" class="field-error" role="alert" aria-live="assertive">
      <svg class="error-icon" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
        <path
          fill-rule="evenodd"
          d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z"
          clip-rule="evenodd"
        />
      </svg>
      <span>{{ error }}</span>
    </div>
  } @else if (hint) {
    <div [id]="hintId" class="field-hint">
      {{ hint }}
    </div>
  }
</div>
